name: Compiler bTicket APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Construire l'APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK et accepter les licences
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Vérifier les fichiers du projet
        run: |
          test -f ./gradlew
          test -f ./settings.gradle.kts
          test -f ./app/build.gradle.kts
          echo "Les fichiers Gradle sont bien à la racine du dépôt."

      - name: Autoriser Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compiler l'APK de test
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Publier l'APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: bticket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
