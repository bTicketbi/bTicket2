name: Compiler bTicket APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Construire l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android nécessaires
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Autoriser Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compiler l'APK de test
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Publier l'APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: bticket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
